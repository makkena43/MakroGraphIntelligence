# Earnings Inflection Detector - example configuration (research-only, opt-in)
#
# Copy to a local, untracked file before editing.  Every paid / writing
# capability below defaults to OFF.  Enabling them does not authorise a
# production activation or an expanded paid run; that needs explicit sign-off.
earnings_inflection:
  country: IN

  source:
    kind: fixtures                     # fixtures | postgres
    path: tests/earnings_inflection/fixtures
    # For kind: postgres the DSN is read from this env var and MUST be a
    # read-only role.  Sessions also force default_transaction_read_only=on.
    dsn_env: EI_READONLY_DSN
    text_root: data/parsed             # where <local_path>.txt parsed text lives, if raw_text is absent
    # Versioned, immutable text artifacts (WP1). When set, the reader prefers an artifact
    # over raw_text, records the exact version in the run manifest, and --extract writes here.
    # Local directory only; nothing is written to the database.
    artifact_root: null                # e.g. data/earnings_inflection/text_artifacts

  # PUBLIC_INFORMATION_RECONSTRUCTION (default): what was public at the cutoff, even if the
  #   system ingested or extracted it later.
  # SYSTEM_KNOWLEDGE_REPLAY: only what THIS system had stored, extracted and mapped by the
  #   cutoff (first_seen_at, text_available_at and alias recorded_at must all be <= cutoff).
  replay_mode: PUBLIC_INFORMATION_RECONSTRUCTION

  parser: {}                           # PDFParser options used by --extract (max_pages etc.)

  identity:
    # Dated symbol history (renames, SME migrations). Empty = symbol assumed stable (disclosed).
    symbol_history: []
    #  - {symbol: OLDSYM, exchange: NSE, issuer_id: ISSUER1, valid_from: 2015-01-01, valid_to: 2021-06-30}
    #  - {symbol: NEWSYM, exchange: NSE, issuer_id: ISSUER1, valid_from: 2021-07-01}
    # Effective-dated issuer registry (WP2). Same shape inline or in a JSON file.
    registry_file: null                # e.g. data/earnings_inflection/issuer_registry.json
    issuers: {}
    #  ISSUER1:
    #    name: Example Industries Limited
    #    aliases:                      # NSE symbol, BSE scrip code, ISIN, old names
    #      - {alias: NEWSYM, kind: nse_symbol, valid_from: 2021-07-01, recorded_at: 2021-07-02, source: NSE circular}
    #      - {alias: "500000", kind: bse_scrip, valid_from: 2010-01-01, recorded_at: 2024-01-05}
    #    securities:                   # dated listing board / series (never taken from present-day metadata)
    #      - {isin: INE000X01011, exchange: NSE, symbol: NEWSYM, series: SM, board: sme, valid_from: 2021-07-01}
    #      - {isin: INE000X01011, exchange: NSE, symbol: NEWSYM, series: EQ, board: mainboard, valid_from: 2024-04-01}
    #    predecessors:                 # spliced into history ONLY when comparable is true
    #      - {predecessor_issuer_id: OLDCO, effective_date: 2022-04-01, comparable: false,
    #         decision_source: "scheme of arrangement; segments not restated"}
    #    industry_history:
    #      - {industry: capital goods, valid_from: 2015-01-01}

  # Explicit, dated counterparty reference data (WP4). Only sources dated on/before the
  # as-of count. This is the ONLY route to "independently_supported_unrelated"; an issuer's
  # own "not a related party" answer stays an issuer assertion.
  counterparties: {}
  #  "Northern Grid Corporation Limited":
  #    relationship: unrelated           # unrelated | related
  #    sources: [{source: "MCA master data", as_of: 2024-01-15}]

  event_lookback_days: 365             # window for order inflow / commitment evidence

  thresholds:                          # descriptive materiality flags, not decision rules
    revenue_yoy_pct: 25.0
    revenue_yoy_acceleration_pp: 10.0
    ebitda_margin_change_bps: 200.0
    pat_yoy_pct: 30.0
    book_to_bill: 1.2
    order_book_cover_years: 2.0
    utilization_change_pp: 10.0
    operating_leverage_min_revenue_growth_pct: 5.0   # EBITDA/revenue growth ratio is noise below this

  mechanism_thresholds:                # WP5: per-mechanism materiality (descriptive, not tuned to named stocks)
    utilization_change_pp: 10.0        # same plant/product scope only
    gross_margin_change_bps: 150.0     # constant cost-of-goods definition
    mix_share_change_pp: 3.0
    mix_min_segment_share_pct: 10.0    # smaller profitable segments cannot move group earnings
    mix_margin_gap_pp: 2.0
    volume_growth_pct: 10.0
    debt_reduction_pct: 10.0
    order_cancellation_share: 0.2
    statement_max_age_days: 200

  bridge_assumptions:                  # WP7: visible analyst assumptions (listed in every bridge's register)
    capex_useful_life_years: 15.0
    capex_debt_share_if_unstated: 0.5  # used only when the company does not state the funding
    incremental_debt_rate_pct: 9.0
    fallback_tax_rate_pct: 25.17       # only when the effective TTM rate is outside 5-40%
    share_basis_max_gap_pct: 10.0      # EPS-implied vs capital-implied shares; larger gaps block EPS

  valuation:                           # WP7: optional context; needs an injected market-data adapter
    enabled: false                     # never changes the evidence status
    reference_pe: [15.0, 25.0]         # visible reference multiples for "implied earnings"
    # default_series: EQ               # only when no dated security record exists for the issuer

  llm:
    enabled: false                     # WP6: needs a provider AND budget.enabled with non-zero limits,
                                       # otherwise the run fails preflight once, before any company
    provider: none                     # none | fake (offline, deterministic) | anthropic
    # fake_responses: tests/llm_fake_responses.json   # provider: fake -> {chunk substring: JSON array}
    model: claude-opus-5-5             # provider: anthropic; credentials from ANTHROPIC_API_KEY / ant auth profile
    effort: low                        # bounded extraction task
    fallbacks: true                    # server-side refusal fallback (Claude API only); set false to disable
    max_tokens: 2048
    max_chunks_per_doc: 4              # only ambiguous / material narrative chunks are sent
    est_tokens_per_call: 2500

  budget:
    enabled: false
    max_calls: 0
    max_tokens: 0
    max_spend_usd: 0.0
    usd_per_1k_tokens: 0.0
    cache_dir: data/earnings_inflection/llm_cache

  persistence:
    enabled: false                     # writes ONLY to schema earnings_inflection in a test database
    dsn_env: EI_TEST_DSN
    allowed_dbname_pattern: "(?:^|_)test(?:_|$)"
